# ==============================================================================
# LabFlow — Docker Compose (Doc 01 §15)
# ==============================================================================
# Architectural Rules & Standards (Doc 01 §15, Doc 08 §6):
#
# 1. Two-Network Model (Doc 01 §15):
#    - edge: Public-facing ingress/external reach. Only services that must be
#      reachable from outside (Caddy reverse proxy and n8n webhook listener surface)
#      attach to this network.
#    - internal: Data isolation network. Connects backend/workers to data stores
#      (PostgreSQL, Redis, MinIO). Non-routable from the external network.
#      Security invariant: n8n cannot reach postgres directly.
#
# 2. Volume Rule (Doc 01 §15):
#    - Named volumes only: postgres_data, redis_data, minio_data, caddy_data, caddy_config.
#    - Rule: Services must NEVER use anonymous volumes or host bind-mounts for data.
#    - All persistent state must survive `docker compose down`.
#
# 3. Fail-Fast Environment Variable Validation (Doc 01 §15, Doc 08 §6):
#    - Every required variable referenced anywhere in this Compose file MUST use
#      this exact syntax:
#        ${VAR_NAME:?error: VAR_NAME is required — copy .env.example to .env and set it}
#    - Rule: NEVER give a required variable a silent default (${VAR:-default} is FORBIDDEN).
#    - Compose aborts `docker compose up` or `config` before any container starts,
#      explicitly naming the missing variable.
#    - Every required variable name must come strictly from Doc 08 §6's inventory
#      and must be documented in .env.example.
# ==============================================================================

networks:
  edge:
    name: edge
    driver: bridge
  internal:
    name: internal
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  minio_data:
    name: minio_data
  n8n_data:
    name: n8n_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

x-backend-common: &backend-common
  image: labflow-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - internal
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    # Settings: public (shared) schema only for the platform surface.
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
    DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?error: DJANGO_SECRET_KEY is required — copy .env.example to .env and set it}"
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-.localhost,127.0.0.1,localhost}
    DATABASE_URL: "postgresql://${POSTGRES_USER:-labflow_app}:${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD is required — copy .env.example to .env and set it}@postgres:5432/${POSTGRES_DB:-labflow}"
    REDIS_URL: "redis://:${REDIS_PASSWORD:?error: REDIS_PASSWORD is required}@redis:6379/0"
    CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?error: REDIS_PASSWORD is required}@redis:6379/0"
    LABFLOW_TOTP_ENCRYPTION_KEY: "${LABFLOW_TOTP_ENCRYPTION_KEY:?error: LABFLOW_TOTP_ENCRYPTION_KEY is required — copy .env.example to .env and set it}"
    JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:?error: JWT_SIGNING_KEY is required and must differ from DJANGO_SECRET_KEY}"
    N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET:?error: N8N_WEBHOOK_SECRET is required and must differ from DJANGO_SECRET_KEY}"
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@labflow.app}
    FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    DOCS_ENABLED: ${DOCS_ENABLED:-0}
    STEP_UP_ENABLED: ${STEP_UP_ENABLED:-0}
    HIBP_ENABLED: ${HIBP_ENABLED:-0}
    N8N_CALLBACK_REQUIRE_SIGNATURE: ${N8N_CALLBACK_REQUIRE_SIGNATURE:-0}
    # Local Compose (base module) speaks HTTP behind Caddy; prod.py forces these on.
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-localhost}
    PLATFORM_FOUNDING_SLOTS_TOTAL: ${PLATFORM_FOUNDING_SLOTS_TOTAL:-0}
    PLATFORM_FOUNDING_PLAN_NAME: ${PLATFORM_FOUNDING_PLAN_NAME:-Founding}
    R2_BUCKET_NAME: ${R2_BUCKET_NAME:-labflow}
    R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?error: R2_ACCESS_KEY_ID is required — no default credentials}"
    R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?error: R2_SECRET_ACCESS_KEY is required — no default credentials}"

services:
  postgres:
    image: postgres:16.4
    container_name: labflow-postgres
    mem_limit: 1g
    cpus: "2.0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labflow}
      POSTGRES_USER: ${POSTGRES_USER:-labflow_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: labflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    networks:
      - internal
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    mem_limit: 256m
    cpus: "1.0"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: labflow-minio
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}"
    volumes:
      - minio_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: labflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}"
      MINIO_ROOT_PASSWORD: "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}"
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-labflow}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$#" -gt 0 ]; then
          exec "$$@"
        fi
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$R2_BUCKET_NAME"
        exit 0
      - /bin/sh

  backend:
    <<: *backend-common
    container_name: labflow-backend
    mem_limit: 1g
    cpus: "2.0"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?error: DJANGO_SECRET_KEY is required — copy .env.example to .env and set it}"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-.localhost,127.0.0.1,localhost}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-labflow_app}:${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD is required — copy .env.example to .env and set it}@postgres:5432/${POSTGRES_DB:-labflow}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?error: REDIS_PASSWORD is required}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?error: REDIS_PASSWORD is required}@redis:6379/0"
      LABFLOW_TOTP_ENCRYPTION_KEY: "${LABFLOW_TOTP_ENCRYPTION_KEY:?error: LABFLOW_TOTP_ENCRYPTION_KEY is required — copy .env.example to .env and set it}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:?error: JWT_SIGNING_KEY is required and must differ from DJANGO_SECRET_KEY}"
      N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET:?error: N8N_WEBHOOK_SECRET is required and must differ from DJANGO_SECRET_KEY}"
      # Mail is a security control (password reset). Empty here fails the prod boot.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@labflow.app}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-0}
      STEP_UP_ENABLED: ${STEP_UP_ENABLED:-0}
      HIBP_ENABLED: ${HIBP_ENABLED:-0}
      N8N_CALLBACK_REQUIRE_SIGNATURE: ${N8N_CALLBACK_REQUIRE_SIGNATURE:-0}
      # Local Compose (base module) speaks HTTP behind Caddy; prod.py forces these on.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-localhost}
      PLATFORM_FOUNDING_SLOTS_TOTAL: ${PLATFORM_FOUNDING_SLOTS_TOTAL:-0}
      PLATFORM_FOUNDING_PLAN_NAME: ${PLATFORM_FOUNDING_PLAN_NAME:-Founding}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-labflow}
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?error: R2_ACCESS_KEY_ID is required — no default credentials}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?error: R2_SECRET_ACCESS_KEY is required — no default credentials}"
      RUN_MIGRATIONS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Celery worker: provisioning (P-3..P-9), reports, notifications, exports.
  worker:
    <<: *backend-common
    container_name: labflow-worker
    mem_limit: 1536m
    cpus: "2.0"
    command:
      - celery
      - -A
      - config
      - worker
      # reports.deliver is declared on the "notifications" queue and
      # tenants.export_tenant on "maintenance". Without -Q the worker only
      # consumes the default "celery" queue, so report delivery and data
      # export would silently sit in Redis forever.
      - -Q
      - celery,notifications,maintenance
      - --loglevel=info
      - --concurrency=4

  # Celery beat: the schedule in config/settings/base.py CELERY_BEAT_SCHEDULE.
  beat:
    <<: *backend-common
    container_name: labflow-beat
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.0
    container_name: labflow-n8n
    restart: unless-stopped
    networks:
      - edge
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - "N8N_LISTEN_ADDRESS=::"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:5678:5678"


  caddy:
    image: caddy:2.8.4-alpine
    container_name: labflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PLATFORM_BASE_DOMAIN=${PLATFORM_BASE_DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Built single-page app; `cd frontend && npm run build` before `up`.
      - ./frontend/dist:/srv/spa:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
