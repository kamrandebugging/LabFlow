# ==============================================================================
# LabFlow — Docker Compose Skeleton (Phase 0, Doc 01 §15)
# ==============================================================================
# Architectural Rules & Standards (Doc 01 §15, Doc 08 §6):
#
# 1. Two-Network Model (Doc 01 §15):
#    - edge: Public-facing ingress/external reach. Only services that must be
#      reachable from outside (Caddy reverse proxy and n8n webhook listener surface)
#      attach to this network.
#    - internal: Data isolation network. Connects backend/workers to data stores
#      (PostgreSQL, Redis, MinIO). Non-routable from the external network.
#      Security invariant: n8n cannot reach postgres directly.
#
# 2. Volume Rule (Doc 01 §15):
#    - Named volumes only: postgres_data, redis_data, minio_data, caddy_data, caddy_config.
#    - Rule: Services must NEVER use anonymous volumes or host bind-mounts for data.
#    - All persistent state must survive `docker compose down`.
#
# 3. Fail-Fast Environment Variable Validation (Doc 01 §15, Doc 08 §6):
#    - Every required variable referenced anywhere in this Compose file MUST use
#      this exact syntax:
#        ${VAR_NAME:?error: VAR_NAME is required — copy .env.example to .env and set it}
#    - Rule: NEVER give a required variable a silent default (${VAR:-default} is FORBIDDEN).
#    - Compose aborts `docker compose up` or `config` before any container starts,
#      explicitly naming the missing variable.
#    - Every required variable name must come strictly from Doc 08 §6's inventory
#      and must be documented in .env.example.
# ==============================================================================

networks:
  edge:
    name: edge
    driver: bridge
  internal:
    name: internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?error: POSTGRES_DB is required — copy .env.example to .env and set it}"
      POSTGRES_USER: "${POSTGRES_USER:?error: POSTGRES_USER is required — copy .env.example to .env and set it}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD is required — copy .env.example to .env and set it}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Local debugging access only (bound strictly to loopback)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: labflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: labflow-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: labflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin123}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-labflow}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$R2_BUCKET_NAME"
        exit 0

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.0
    container_name: labflow-n8n
    restart: unless-stopped
    networks:
      - edge
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - "N8N_LISTEN_ADDRESS=::"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2

