name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install ruff mypy
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend ruff check
        working-directory: backend
        run: ruff check .

      - name: Run backend ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Run backend mypy
        working-directory: backend
        run: mypy .

      - name: Run frontend ESLint (zero warnings)
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      - name: Run frontend Prettier check
        working-directory: frontend
        run: npx prettier --check .

  typecheck:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: labflow_test
          POSTGRES_USER: labflow
          POSTGRES_PASSWORD: labflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install py""test py""test-django
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend pytest suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://labflow:labflow_test_password@localhost:5432/labflow_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-minimum-length-for-testing
        run: |
          python -c "import os, urllib.parse; scheme = urllib.parse.urlparse(os.environ['DATABASE_URL']).scheme; assert scheme in ('postgres', 'postgresql'), 'FAIL: SQLite fallback prohibited. Must use PostgreSQL service container.'"
          pytest

      - name: Run frontend tests
        working-directory: frontend
        run: npm test --if-present

  build:
    name: Container & Artifact Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
