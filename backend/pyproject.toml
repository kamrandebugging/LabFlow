[project]
name = "labflow-backend"
version = "0.1.0"
description = "LabFlow - Multi-tenant SaaS platform for diagnostic laboratories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LAB-49 Phase 3.5: pin the Django major/minor actually deployed (6.1.x).
    # Doc 01 still says Django 5; adopting 6.1 is the recorded decision.
    "django>=6.1,<6.2",
    "djangorestframework>=3.15.0,<3.16",
    "drf-spectacular>=0.27.0,<1.0",
    "django-tenants>=3.7.0,<4.0",
    "django-environ>=0.11.0,<1.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "redis>=5.0.0,<6.0",
    "celery>=5.0,<6.0",
    "packaging>=24.0",  # kombu redis transport imports packaging (worker/beat crash without it)
    "PyJWT>=2.8.0,<3.0",
    "argon2-cffi>=23.1.0,<26.0",
    "pyotp>=2.10.0,<3.0",
    "cryptography>=50.0.2",
    "weasyprint>=60.0,<70.0",
    "qrcode>=7.4.2,<9.0",
    "requests>=2.31.0,<3.0",
    "gunicorn>=22.0.0,<24.0",
    # LAB-49 Phase 3.7 (SE-30): error reporting, scrubber wired in
    # apps/core/observability.py.
    "sentry-sdk[django]>=2.0.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-xdist>=3.0.0",
    "factory-boy>=3.3.0",
    "mypy>=1.10.0,<2.0",
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-xdist>=3.0.0",
    "factory-boy>=3.3.0",
    "pypdf>=4.0.0",
    "mypy>=1.11.0",
    "django-stubs>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

# ==============================================================================
# Ruff Configuration (Doc 09 §5.1)
# ==============================================================================
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Star-imports are required for the split-settings pattern (base -> dev, base -> test)
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]
"**/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# Mypy Configuration (Doc 09 §5.1)
# ==============================================================================
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = [
    "django_tenants.*",
    "environ",
    "factory.*",
    "celery.*",
    "jwt",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apps.core.models",
    "tests.*",
    "apps.accounts.tests.*",
]
disallow_subclassing_any = false
disallow_untyped_calls = false
disable_error_code = ["misc", "comparison-overlap", "attr-defined", "type-arg", "name-defined"]

# ==============================================================================
# Pytest Configuration (Doc 09 §9.1)
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "apps"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_debug_mode = "keep"
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "smoke: environment and connectivity smoke tests",
    "unit: fast unit tests without external network",
    "integration: integration tests requiring postgres and redis",
    "tenancy: tenant isolation and schema tests",
    "factory: factory_boy pattern and isolation tests",
    "isolation: cross-tenant model registry harness tests (Doc 04 §13.7)",
    "dg: Doc 09 development guidelines meta-test suite (Doc 09 §18)",
]
