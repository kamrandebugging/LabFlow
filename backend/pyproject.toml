[project]
name = "labflow-backend"
version = "0.1.0"
description = "LabFlow - Multi-tenant SaaS platform for diagnostic laboratories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.18",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.27.0",
    "django-tenants>=3.7.0",
    "django-environ>=0.11.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "mypy>=1.10.0,<2.0",
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ==============================================================================
# Ruff Configuration (Doc 09 §5.1)
# ==============================================================================
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Star-imports are required for the split-settings pattern (base -> dev)
"config/settings/dev.py" = ["F403", "F405"]
"**/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# Mypy Configuration (Doc 09 §5.1)
# ==============================================================================
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[[tool.mypy.overrides]]
module = [
    "django_tenants.*",
    "environ",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apps.core.models",
    "tests.*",
]
disallow_subclassing_any = false
disallow_untyped_calls = false
disable_error_code = ["misc", "comparison-overlap", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "factory",
    "factory.*",
]
implicit_reexport = true

# ==============================================================================
# Pytest Configuration (Doc 09 §9.1)
# ==============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
django_debug_mode = "keep"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
