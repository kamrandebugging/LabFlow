s":"0.25rem","gutter-lg":"1.5rem","margin":"1rem","space-lg":"1.5rem","space-2xl":"3rem","margin-md":"1.5rem","gutter":"1rem","gutter-md":"1.25rem"},fontFamily:{"label-md":["Inter"],"body-lg":["Inter"],"display-lg":["Manrope"],"headline-sm":["Manrope"],"headline-lg":["Manrope"],"label-sm":["Inter"],"headline-md":["Manrope"],"body-sm":["Inter"],"data-mono":["Inter"],"body-md":["Inter"],"display-lg-mobile":["Manrope"]},fontSize:{"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.01em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"display-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-sm":["16px",{"lineHeight":"24px","letterSpacing":"-0.005em","fontWeight":"600"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.03em","fontWeight":"600"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"400"}],"data-mono":["13px",{"lineHeight":"18px","letterSpacing":"-0.01em","fontWeight":"500"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}],"display-lg-mobile":["28px",{"lineHeight":"36px","letterSpacing":"-0.015em","fontWeight":"700"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen relative overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-container"><div class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-fixed/20 via-background to-surface z-0"></div><div class="fixed top-6 right-6 z-50"><div class="bg-surface-container-high/80 backdrop-blur-md p-1 rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)] flex items-center space-x-1"><button class="px-3 py-1.5 rounded bg-surface-container-lowest text-on-surface font-label-md text-label-md shadow-[0_1px_2px_rgba(15,23,42,0.05)] transition-colors" type="button">English</button><button class="px-3 py-1.5 rounded text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors" type="button">اردو</button></div></div><main class="relative z-10 w-full min-h-screen flex items-center justify-center p-space-md lg:p-margin-lg"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-sm p-8 flex flex-col relative">
<div class="flex items-center justify-between mb-space-lg">
<div class="flex items-center space-x-2.5">
<div class="w-9 h-9 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M10 2v7.31L4.1 19.34A2 2 0 0 0 5.8 22h12.4a2 2 0 0 0 1.7-2.66L14 9.31V2"></path>
<path d="M8.5 2h7"></path>
<path d="M7 16h10"></path>
</svg>
</div>
<div class="flex items-baseline space-x-1.5">
<span class="font-headline-md text-headline-md text-on-surface tracking-tight font-bold">LabFlow</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-normal">LIS v4.2</span>
</div>
</div>
<span class="px-2 py-0.5 rounded bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">
        Portal
      </span>
</div>
<div class="mb-space-lg bg-surface-container-low rounded-lg p-3">
<div class="flex items-start justify-between">
<div>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold flex items-center gap-1.5">
            City Diagnostic Lab — Lahore
          </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Staff sign in</p>
</div>
<span class="inline-flex items-center gap-1 font-label-sm text-label-sm text-primary px-1.5 py-0.5 rounded bg-primary-fixed/40">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
          PK-LHE-01
        </span>
</div>
</div>
<form class="flex flex-col space-y-4" id="loginForm" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium flex justify-between items-center" for="email">
<span>Email</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Lab ID or Official Mail</span>
</label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg px-3.5 py-2.5 outline-none transition-all placeholder:text-on-surface-variant/50 shadow-[0_1px_2px_rgba(15,23,42,0.06)]" id="email" placeholder="staff@citylab.pk" required="" type="email" value="staff@citylab.pk"/>
</div>
</div>
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-tertiary transition-colors" href="javascript:void(0)" onclick="handleForgotNotice()">
            Reset via Lab Admin
          </a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg pl-3.5 pr-10 py-2.5 outline-none transition-all placeholder:text-on-surface-variant/50 shadow-[0_1px_2px_rgba(15,23,42,0.06)]" id="password" placeholder="Enter your security credentials" required="" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 rounded text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px] block" id="toggleIcon">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary-container hover:bg-primary active:bg-tertiary text-on-primary font-label-md text-label-md py-2.5 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2 cursor-pointer font-medium" id="submitBtn" type="submit">
<span id="btnLabel">Sign in</span>
<span class="material-symbols-outlined text-[18px]" id="btnIcon">arrow_forward</span>
</button>
</div>
<div class="flex items-center justify-center gap-2 py-2 px-3 bg-error-container text-on-error-container rounded-lg font-label-sm text-label-sm transition-all" id="errorNotice" role="alert">
<span class="material-symbols-outlined text-[16px] text-error">error</span>
<span>Email, password or code is not correct</span>
</div>
</form>
<div class="mt-8 pt-5 bg-transparent text-center">
<div class="flex items-center justify-center gap-1.5 text-on-surface-variant/60 mb-2">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">Secured Clinical Node</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 leading-relaxed">
        Authorized staff access only. Activity is monitored and logged under ISO 15189 compliance.
      </p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    if (!passwordInput || !toggleIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }

  function handleSubmit() {
    const errorNotice = document.getElementById('errorNotice');
    const btnLabel = document.getElementById('btnLabel');
    const btnIcon = document.getElementById('btnIcon');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!submitBtn) return;
    
    btnLabel.textContent = 'Authenticating...';
    btnIcon.classList.add('animate-spin');
    btnIcon.textContent = 'progress_activity';
    submitBtn.disabled = true;

    setTimeout(() => {
      btnLabel.textContent = 'Sign in';
      btnIcon.classList.remove('animate-spin');
      btnIcon.textContent = 'arrow_forward';
      submitBtn.disabled = false;
      if (errorNotice) {
        errorNotice.classList.remove('opacity-70');
        errorNotice.classList.add('opacity-100');
      }
    }, 600);
  }

  function handleForgotNotice() {
    alert('Please contact your Lab Supervisor or Technical Administrator to trigger an authorized credential reissue.');
  }
</script></main></body></html>
