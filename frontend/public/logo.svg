<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" width="100%" height="100%">
  <!-- Emerald Badge -->
  <rect x="5" y="5" width="140" height="140" rx="34" fill="#0E6B3A" />
  
  <!-- Geometric 'L' and 'F' combination in crisp white -->
  <!-- 'L' vertical stem -->
  <rect x="36" y="36" width="19" height="69" fill="#FFFFFF" />
  <!-- 'L' horizontal base connected into F -->
  <rect x="36" y="87" width="59" height="18" fill="#FFFFFF" />
  
  <!-- 'F' top bar -->
  <rect x="72" y="36" width="48" height="19" fill="#FFFFFF" />
  <!-- 'F' vertical stem -->
  <rect x="72" y="36" width="18" height="52" fill="#FFFFFF" />
  <!-- 'F' middle crossbar (white portion) -->
  <rect x="72" y="68" width="31" height="16" fill="#FFFFFF" />
  
  <!-- 'F' middle crossbar accent (gold portion) -->
  <rect x="103" y="68" width="16" height="16" fill="#C9A227" />
  
  <!-- Bottom accent underline pill (gold) -->
  <rect x="36" y="116" width="83" height="9" rx="4.5" fill="#C9A227" />
</svg>
